  <text x="18" y="486" fill="#8eb8d8" font-family="Menlo,Consolas,monospace" font-size="12">✔ HEALTHY | ENGINE:qwen2.5-coder:14b | PROFILE:production | RBAC:ADMIN | AUDIT:ON | TOFU:ON | CACHE:ON | MODE:operator</text>
