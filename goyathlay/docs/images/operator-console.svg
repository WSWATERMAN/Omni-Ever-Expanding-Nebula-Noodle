  <desc id="desc">Terminal preview showing quick help, a persistent health and operations footer, and the required command approval prompt.</desc>
  <rect width="1080" height="500" rx="14" fill="#101820"/>
  <path d="M0 14a14 14 0 0 1 14-14h1052a14 14 0 0 1 14 14v42H0z" fill="#1c2b36"/>
  <circle cx="28" cy="28" r="7" fill="#ff6b6b"/><circle cx="52" cy="28" r="7" fill="#ffd166"/><circle cx="76" cy="28" r="7" fill="#06d6a0"/>
